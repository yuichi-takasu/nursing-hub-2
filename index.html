<body><a class="skip" href="#main">本文へ</a><div class="shell">
<aside><div class="brand"><span class="brandmark" aria-hidden="true">＋</span><div><strong>浦安中央病院</strong><small id="brand-sub">看護教育・研修ハブ</small></div></div><nav id="nav" aria-label="メインメニュー"></nav><div class="sidefoot">院内研修ポータル<small>URAYASU CENTRAL HOSPITAL</small></div></aside>
<div class="workspace"><header><span id="crumb">研修ホーム</span><button id="identity" class="identity" type="button">利用者を入力</button></header><main id="main" tabindex="-1"><div class="panel">教材を読み込んでいます…</div></main></div></div>

<noscript>この研修ページを利用するにはJavaScriptを有効にしてください。</noscript><script>
window.HUB_CONFIG = {
  // 新しい Code.gs をデプロイして得られる /exec URL。従来版のURLは互換性確認後に設定します。
  apiUrl: 'https://script.google.com/macros/s/AKfycbyCk2snB4eOMIZU_W-wwGkNgoh8OhEgsdXvuhyAwgOTjIz1YQdB-2sMnpXY9RXo_6Cmww/exec',
  title: '看護教育・研修ハブ',
  hospital: '浦安中央病院',
  // ?hub=医療安全 のように、入口ごとに表示する種別を切り替えられます。
  defaultHub: '看護教育',
  cookieDays: 180
};

</script>
<script>
(function(root) {
  'use strict';
  const categories=['看護技術','看護知識','看護記録','患者ケア','医療技術','医療知識','その他'];
  function esc(v) { return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function video(v) {
    try {
      const u=new URL(v); if(u.protocol!=='https:') return null;
      const h=u.hostname.toLowerCase(); let id='';
      if(h==='youtu.be') id=u.pathname.split('/')[1];
      else if(['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(h)) {
        if(u.pathname==='/watch') id=u.searchParams.get('v');
        else if(/^\/(embed|shorts|live)\//.test(u.pathname)) id=u.pathname.split('/')[2];
      } else if(/\.(mp4|webm)$/i.test(u.pathname)) return {kind:'file',src:u.href,original:u.href};
      else return {kind:'link',src:u.href,original:u.href};
      if(!/^[A-Za-z0-9_-]{11}$/.test(id||'')) return null;
      return {kind:'youtube',src:'https://www.youtube.com/embed/'+id,original:'https://www.youtube.com/watch?v='+id};
    } catch {return null;}
  }
  function grade(questions,answers) {
    const missed=[];let correct=0;
    questions.forEach((q,i)=>{if(answers[i]===q.correct) correct++;else missed.push(q.q);});
    return {score:questions.length?Math.round(correct/questions.length*100):0,correct,total:questions.length,missed};
  }
  function status(m,p={}) {
    if(!m.video) return '教材準備中';
    if(!p.watched) return '未視聴';
    if(!m.questions.length) return '完了';
    if(!p.quiz) return 'テスト未受験';
    return p.quiz.missed.length?'再確認':'完了';
  }
  function key(m) {return m.id+'@'+m.version;}
  const api={categories,esc,video,grade,status,key};
  root.HubCore=api;
  if(typeof module!=='undefined')module.exports=api;
})(typeof window==='undefined'?globalThis:window);

</script>
<script>
/* GitHub Pages 静的画面。公開されるのは教材データのみ。 */
'use strict';
const C=HubCore, cfg=window.HUB_CONFIG||{}, $=s=>document.querySelector(s);
const params=new URLSearchParams(location.search), demo=params.get('demo')==='1';
const hub=params.get('hub')||cfg.defaultHub||'看護教育';
const cookiePath=new URL('.',location.href).pathname;
const cookieName='uch_hub_profile_'+encodeURIComponent(cookiePath);
let user=null, modules=[], progress={}, queue=[], page='home', selected=null, busy=false, loading=true, loadError='', toastTimer;
let memory={};
const store={get(k,f){try{return JSON.parse(localStorage.getItem(k))??f;}catch{return memory[k]??f;}},set(k,v){memory[k]=v;try{localStorage.setItem(k,JSON.stringify(v));return true;}catch{return false;}}};
const namespace='uch-hub-v2:'+cookiePath+':'+(demo?'demo:':'live:');
queue=store.get(namespace+'queue',[]);
function cookie(value,days){document.cookie=cookieName+'='+encodeURIComponent(value)+'; Max-Age='+Math.floor(days*86400)+'; Path='+cookiePath+'; SameSite=Lax'+(location.protocol==='https:'?'; Secure':'');}
function savedProfile(){try{const raw=document.cookie.split('; ').find(v=>v.startsWith(cookieName+'='));return raw?JSON.parse(decodeURIComponent(raw.substring(raw.indexOf('=')+1))):null;}catch{return null;}}
function progressKey(who=user){return namespace+'progress:'+who.id;}
function notify(msg){$('#toast').textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',6500);}
function button(label,action,extra=''){return `<button type="button" class="button ${extra}" data-action="${C.esc(action)}">${label}</button>`;}
function date(v){return new Date(v).toLocaleString('ja-JP');}
function mineQueue(){return queue.filter(e=>e.staffId===user?.id);}
function pfor(m){return progress[C.key(m)]||{};}
function visible(){return modules.filter(m=>!m.hub||m.hub===hub);}
function target(m){return !m.group||/^(全員|全職種|すべて)$/.test(m.group)||m.group.split(/[,、，]/).some(x=>x.trim()===user?.group||(user?.group==='新人看護師'&&x.trim()==='看護師'));}
function pill(s){return `<span class="pill ${s==='完了'?'good':s==='再確認'?'warn':'blue'}">${C.esc(s)}</span>`;}
function syncNotice(){const n=mineQueue().length;return n?`<div id="sync-notice" class="notice" role="status">受講記録 ${n}件が未送信・確認待ちです。${button('再送信する','sync','small secondary')}<br>送信済みになるまで、この端末のブラウザーデータを消さないでください。${mineQueue().filter(e=>e.error).map(e=>`<p class="error">${C.esc(e.title)}：${C.esc(e.error)}</p>`).join('')}</div>`:'';}
function applyUser(v){user=v;progress=store.get(progressKey(),{});$('#identity').textContent=v.name+' さん · '+v.group;}
function profileForm(){
  const old=user||{id:'',name:'',group:''};
  $('#modal-content').innerHTML=`<div class="dialoghead"><h2 id="dialog-title">利用者情報</h2>${user?button('閉じる','close','secondary'):''}</div><p class="muted">職員番号・氏名・職種を入力してください。ChatGPTへの登録は不要です。</p><form id="profile-form"><label>職員番号<input name="id" required maxlength="40" autocomplete="off" value="${C.esc(old.id)}" placeholder="例：00123"></label><label>氏名<input name="name" required maxlength="60" autocomplete="name" value="${C.esc(old.name)}"></label><label>職種<select name="group" required><option value="">選択してください</option>${['新人看護師','看護師','看護助手','医師','リハビリスタッフ','薬剤師','放射線技師','臨床検査技師','栄養士','事務職員','その他'].map(v=>`<option ${old.group===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="check"><input type="checkbox" name="remember" ${savedProfile()?'checked':''}>この端末に利用者情報を記憶する（180日）</label><p class="muted">個人の携帯端末では記憶すると再入力を省けます。共用タブレットではチェックを外し、使用後に「利用者を切り替える」を押してください。</p><button class="button">この利用者で開く</button><p class="error" id="profile-error" role="alert"></p></form>${user?`<hr>${button('記憶を消して利用者を切り替える','logout','secondary')}`:''}`;
  if(!$('#modal').open)$('#modal').showModal();
  $('#profile-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const v={id:String(f.get('id')).trim(),name:String(f.get('name')).trim(),group:String(f.get('group'))};if(!v.id||!v.name||!v.group)return;cookie('',-1);if(f.get('remember')){cookie(JSON.stringify(v),cfg.cookieDays||180);if(!savedProfile())notify('Cookieが保存できないため、次回は利用者情報の再入力が必要です。');}applyUser(v);selected=null;page='home';$('#modal').close();render();flush();};
}
function nav(){
  $('#nav').innerHTML='<p class="nav-caption">LEARNING PORTAL</p>'+[['home','研修ホーム','⌂'],['catalog','動画教材','▷'],['todo','未完了研修','☑'],['history','この端末の教育履歴','▤'],['guide','使い方','？']].map(([id,label,icon])=>`<button type="button" class="navitem" data-page="${id}" ${page===id?'aria-current="page"':''}><span class="ico" aria-hidden="true">${icon}</span>${label}</button>`).join('');
  $('#crumb').textContent=page==='detail'?'教材を視聴':({home:'研修ホーム',catalog:'動画教材',todo:'未完了研修',history:'この端末の教育履歴',guide:'使い方'})[page];
}
function card(m,i=0){const st=C.status(m,pfor(m));return `<article class="card"><div class="thumb cat${i%3}"><span>▷ ${C.esc(m.category||'未分類')}</span><span class="duration">${m.duration?C.esc(m.duration)+'分':'動画教材'}</span></div><div class="cardbody"><div class="tags"><span class="pill">${C.esc(m.group||'全職種')}</span>${m.required!==false?'<span class="pill">必須</span>':'<span class="pill">任意</span>'}</div><h3>${C.esc(m.title||'名称未設定')}</h3><p>${C.esc(m.description||m.business||'動画と標準手順を確認しましょう。')}</p></div><div class="cardfooter">${pill(st)}<button type="button" class="button small" data-module="${C.esc(m.id)}">教材を開く →</button></div></article>`;}
function render(){
  nav();const list=visible(), required=list.filter(m=>target(m)&&m.required!==false), done=required.filter(m=>C.status(m,pfor(m))==='完了').length;
  let prefix=demo?'<div class="notice">動作確認用デモです。入力はこのブラウザー内だけに保存し、受講台帳には送信しません。</div>':'';
  if(!user){$('#main').innerHTML=prefix+'<div class="panel"><h1>研修を始めましょう</h1><p>初めに利用者情報を入力してください。</p>'+button('利用者を入力','profile')+'</div>';return;}
  if(loading){$('#main').innerHTML=prefix+'<div class="panel" role="status">教材台帳を読み込んでいます…</div>';return;}
  if(loadError&&page!=='guide'){$('#main').innerHTML=prefix+`<div class="panel"><h1>教材を読み込めませんでした</h1><p class="error">${C.esc(loadError)}</p>${button('再読み込み','reload')} ${button('接続設定の説明','guide','secondary')}</div>`;return;}
  prefix+=syncNotice();
  if(page==='home'){
    $('#main').innerHTML=prefix+`<div class="pagehead"><div><div class="eyebrow">LEARNING & TRAINING</div><h1>${C.esc(hub)}・研修ハブ</h1><p>${C.esc(user.name)}さん、今日も一つずつ確認していきましょう。</p></div>${button('教材を更新','reload','secondary')}</div><section class="hero"><div><h2>同じ手順で、安心できるケアを。</h2><p>新人も先輩も、動画で標準手順を確認。<br>勤務が合わない日も、学びを記録できます。</p>${button('動画教材を探す →','catalog')}</div><div class="motif" aria-hidden="true"><span>▶</span></div></section><div class="metrics">${[['対象の必須教材',required.length],['この端末で完了',done],['未完了',required.length-done],['再確認',required.filter(m=>C.status(m,pfor(m))==='再確認').length]].map(([s,n])=>`<div class="metric"><small>${s}</small><strong>${n}<span style="font-size:14px"> 件</span></strong></div>`).join('')}</div><div class="sectiontitle"><h2>あなたの対象教材</h2>${button('すべて見る','catalog','link')}</div><div class="cards">${required.slice(0,6).map(card).join('')||'<div class="empty">対象教材はまだ登録されていません。</div>'}</div><p class="muted footnote">進捗表示はこの端末の記録です。管理者はスプレッドシートで全端末の受講記録を確認できます。</p>`;
  } else if(page==='catalog'||page==='todo'){
    $('#main').innerHTML=prefix+`<div class="pagehead"><div><div class="eyebrow">VIDEO LIBRARY</div><h1>${page==='todo'?'未完了研修':'動画教材'}</h1><p>動画の視聴後に、受講記録と確認テストを残せます。</p></div></div><div class="bar"><input id="search" type="search" aria-label="教材を検索" placeholder="教材名・対象業務で検索"><select id="category" aria-label="分類"><option value="">すべての分類</option>${C.categories.map(x=>`<option>${x}</option>`).join('')}</select><label class="check"><input id="only-target" type="checkbox" checked>自分の対象のみ</label></div><div class="cards" id="cards"></div>`;
    const filter=()=>{const q=$('#search').value.toLowerCase(),cat=$('#category').value;const items=list.filter(m=>(!$('#only-target').checked||target(m))&&(!cat||m.category===cat)&&(!q||[m.title,m.business,m.category,m.group].join(' ').toLowerCase().includes(q))&&(page!=='todo'||(m.required!==false&&C.status(m,pfor(m))!=='完了')));$('#cards').innerHTML=items.map(card).join('')||'<div class="empty">該当する教材はありません。</div>';};$('#search').oninput=filter;$('#category').onchange=filter;$('#only-target').onchange=filter;filter();
  } else if(page==='detail') detail();
  else if(page==='history'){
    const rows=Object.entries(progress).sort((a,b)=>new Date(b[1].updated||0)-new Date(a[1].updated||0));
    $('#main').innerHTML=prefix+`<div class="pagehead"><div><div class="eyebrow">MY LEARNING</div><h1>この端末の教育履歴</h1><p>${C.esc(user.name)}さんの記録。他の端末の履歴はここには表示されません。</p></div></div><div class="panel tablewrap"><table><thead><tr><th>教材・版</th><th>受講状況</th><th>最終更新</th><th>送信</th></tr></thead><tbody>${rows.map(([k,p])=>`<tr><td>${C.esc(p.title)}<br><small>${C.esc(k)}</small></td><td>${p.quiz?C.esc(p.quiz.score)+'% · '+(p.quiz.missed.length?'再確認':'テスト合格'):p.watched?'視聴済み':'記録あり'}</td><td>${date(p.updated)}</td><td>${queue.some(e=>e.staffId===user.id&&C.key(e.module)===k)?'確認待ち':demo?'デモ保存':'送信済み'}</td></tr>`).join('')||'<tr><td colspan="4">受講記録はまだありません。</td></tr>'}</tbody></table></div><div class="notice">教材が更新されると、新しい版は未視聴になります。過去の版の履歴は残ります。</div>`;
  } else {
    $('#main').innerHTML=prefix+`<div class="pagehead"><h1>使い方</h1></div><section class="panel"><h2>視聴と記録</h2><p>① 利用者情報を入力 → ② 教材を選ぶ → ③ 動画を見る → ④「視聴済みを記録」→ ⑤ 確認テスト。</p><p>記録は自己申告です。職員番号の入力はアカウント認証ではありません。正式な受講確認は管理者が台帳で行います。</p></section><section class="panel"><h2>個人端末・共用タブレット</h2><p>個人端末は「記憶する」にチェックすると次回の入力が不要です。共用端末は利用者情報を記憶せず、使用後に利用者を切り替えてください。</p><p>履歴と通信待ちの記録は端末内に保存されます。プライベートブラウズやデータ削除では保持できません。</p></section><section class="panel"><h2>教材管理</h2><p>教材の追加・動画URL・分類・標準手順・確認テスト・全体講評はGoogleスプレッドシートで更新します。変更後は「教材を更新」を押してください。</p><p>接続設定は管理者が config.js にApps Scriptの公開URLを一度登録します。未設定時は教材を表示しません。動作確認はURL末尾に ?demo=1 を付けます。</p><p>手順差の報告には患者氏名などの個人情報を記載しないでください。個別フィードバックの公開閲覧機能は設けていません。</p></section>`;
  }
}
function detail(){
  const m=modules.find(x=>x.id===selected);if(!m){page='catalog';return render();}const p=pfor(m),v=C.video(m.video),st=C.status(m,p);
  let player='<div class="empty-video">動画は準備中です。</div>';
  if(v?.kind==='youtube') player=`<iframe class="video" title="${C.esc(m.title)}" src="${C.esc(v.src)}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
  else if(v?.kind==='file')player=`<video class="video" controls playsinline preload="metadata" src="${C.esc(v.src)}"></video>`;
  else if(v?.kind==='link')player='<div class="empty-video">別サイトで教材を開いてご覧ください。</div>';
  else if(m.video)player='<div class="empty-video">動画URLを確認してください。HTTPSのURLに対応しています。</div>';
  $('#main').innerHTML=(demo?'<div class="notice">デモ表示・台帳には送信しません。</div>':'')+syncNotice()+`<div class="pagehead"><div>${button('← 教材一覧','catalog','link')}<h1>${C.esc(m.title||'名称未設定')}</h1><p>${C.esc(m.category||'未分類')} · ${C.esc(m.group||'全職種')} · 版 ${C.esc(m.version)}</p></div>${pill(st)}</div><div class="columns"><div><section class="panel"><h2>動画を視聴</h2>${player}${v?`<p><a class="button secondary" href="${C.esc(v.original)}" target="_blank" rel="noopener noreferrer">別のタブで動画を開く ↗</a></p>`:''}<p class="muted footnote">最後まで確認したら、下のボタンで視聴を記録してください。</p>${p.watched?'<p class="notice">✓ 視聴済みとして記録されています。</p>':`<button class="button wide" data-action="watch" ${v?'':'disabled'}>視聴済みを記録する</button>`}</section><section class="panel"><h2>標準手順・教材資料</h2><p class="pre">${C.esc(m.standard||'標準手順は未登録です。')}</p></section>${m.feedback?`<section class="panel"><h2>全体講評・共通の確認事項</h2><p class="pre">${C.esc(m.feedback)}</p></section>`:''}</div><div><section class="panel"><h2>確認テスト</h2><div id="quiz-area">${!m.questions.length?'<p class="muted">この教材に確認テストはありません。視聴記録で完了になります。</p>':!p.watched?'<p class="muted">動画を視聴し「視聴済みを記録」すると回答できます。</p>':quizHtml(m,p)}</div></section><section class="panel"><h2>教わった手順が違ったら</h2><p>動画・標準手順と現場の指導に違いがあった場合、教育担当者へ確認を依頼できます。</p>${button('手順差を記録・相談','consult','secondary wide')}</section></div></div>`;
  bindQuiz(m);
}
function quizHtml(m,p){return `${p.quiz?`<div class="notice"><strong>前回の正答率 ${p.quiz.score}%</strong>${p.quiz.missed.length?'<p>再確認：'+p.quiz.missed.map(C.esc).join('／')+'</p>':'<p>全問正解です。</p>'}</div>`:''}<form id="quiz-form">${m.questions.map((q,i)=>`<fieldset><legend>問${i+1} ${C.esc(q.q)}</legend><div class="question">${q.options.map((s,j)=>`<label class="check answer"><input type="radio" name="q${i}" value="${j}" required>${C.esc(s)}</label>`).join('')}</div></fieldset>`).join('')}<button class="button wide">回答を記録する</button></form>`;}
function bindQuiz(m){if(!$('#quiz-form'))return;$('#quiz-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const answers=m.questions.map((_,i)=>Number(f.get('q'+i)));const result=C.grade(m.questions,answers);record(m,'テスト',{answers},result);detail();notify(result.missed.length?'回答を記録しました。誤答した項目を再確認してください。':'全問正解です。回答を記録しました。');};}
function record(m,type,extra={},result){
  if(!user)return;const who={...user};const k=C.key(m);const p=progress[k]||{};
  progress[k]={...p,title:m.title,updated:new Date().toISOString(),...(type==='視聴'?{watched:true}:{}),...(result?{quiz:result}:{})};
  const event={eventId:crypto.randomUUID(),staffId:who.id,name:who.name,group:who.group,module:{id:m.id,version:m.version},title:m.title,type,at:new Date().toISOString(),...extra};
  queue.push(event);const savedProgress=store.set(progressKey(who),progress),savedQueue=store.set(namespace+'queue',queue),ok=savedProgress&&savedQueue;
  if(!ok)notify('端末への保存ができません。ページを閉じずに送信完了を確認してください。');
  if(demo){queue=queue.filter(x=>x.eventId!==event.eventId);store.set(namespace+'queue',queue);}else flush();
}
function consult(){const m=modules.find(x=>x.id===selected);$('#modal-content').innerHTML=`<div class="dialoghead"><h2 id="dialog-title">手順差の記録・相談</h2>${button('閉じる','close','secondary')}</div><p>${C.esc(m.title)}</p><form id="consult-form"><label>動画・マニュアルで確認した手順<textarea name="standard" maxlength="2500"></textarea></label><label>現場で教わった手順<textarea name="taught" maxlength="2500"></textarea></label><label>確認したいこと<textarea name="question" required maxlength="2500"></textarea></label><p class="muted">教育管理者がスプレッドシートで確認します。患者氏名などの個人情報は記載しないでください。</p><button class="button">記録を送信する</button></form>`;$('#modal').showModal();$('#consult-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);record(m,'相談',{standard:f.get('standard'),taught:f.get('taught'),question:f.get('question')});$('#modal').close();render();notify(demo?'相談をデモ保存しました。':'相談を送信待ちに追加しました。');};}
function jsonp(action,additional={}){
  return new Promise((resolve,reject)=>{const cb='uchCallback_'+crypto.randomUUID().replaceAll('-',''),script=document.createElement('script');let timer;const cleanup=()=>{clearTimeout(timer);delete window[cb];script.remove();};window[cb]=data=>{cleanup();resolve(data);};script.onerror=()=>{cleanup();reject(new Error('台帳に接続できません。通信・Apps Scriptの公開設定を確認してください。'));};timer=setTimeout(()=>{cleanup();reject(new Error('接続がタイムアウトしました。もう一度お試しください。'));},20000);const u=new URL(cfg.apiUrl);u.search=new URLSearchParams({action,callback:cb,...additional,_:Date.now()}).toString();script.src=u.href;document.head.append(script);});
}
async function flush(){
  if(demo||busy||!cfg.apiUrl||!navigator.onLine||!queue.length)return;busy=true;
  try{for(const e of [...queue]){
    let receipt=await jsonp('receipt',{id:e.eventId});
    if(receipt.status==='missing'){
      await fetch(cfg.apiUrl,{method:'POST',mode:'no-cors',credentials:'omit',body:new URLSearchParams({payload:JSON.stringify(e)})});
      for(let i=0;i<4;i++){receipt=await jsonp('receipt',{id:e.eventId});if(receipt.status!=='missing')break;await new Promise(r=>setTimeout(r,800));}
    }
    if(receipt.status==='saved'){queue=queue.filter(x=>x.eventId!==e.eventId);store.set(namespace+'queue',queue);}
    else if(receipt.status==='error'){e.error=receipt.message;store.set(namespace+'queue',queue);notify('記録を送信できません：'+receipt.message);continue;}
    else break;
  }}catch{notify('通信待ちです。接続後に再送信できます。');}finally{busy=false;/* 回答中のフォームを再描画しない */if(page==='home'||page==='history')render();else refreshSyncBanner();}
}
function refreshSyncBanner(){const old=$('#sync-notice');if(old){const next=syncNotice();if(next)old.outerHTML=next;else{old.remove();notify('台帳への保存を確認しました。');}}}
async function load(){
  loading=true;loadError='';render();
  if(demo){modules=[{id:'orientation-demo',version:'demo1',title:'研修ハブの使い方（動作確認）',category:'その他',group:'全員',hub:'看護教育',video:'https://youtu.be/WKHIVWnmxPk',standard:'動作確認用の教材です。実際の標準手順は、教材台帳に登録してください。',description:'動画の表示、受講記録、確認テストの動作を確認できます。',questions:[{q:'視聴記録を残すには、どの操作をしますか？',options:['動画を確認して「視聴済みを記録する」を押す','ページを閉じる','分類を変更する'],correct:0}],feedback:'試用結果を確認し、実際の教材へ切り替えてください。',required:true}];loading=false;render();return;}
  if(!cfg.apiUrl){loading=false;loadError='Googleスプレッドシートへの接続URLが未設定です。管理者は同梱の導入手順に従って設定してください。';render();return;}
  try{const url=new URL(cfg.apiUrl);if(url.origin!=='https://script.google.com'||!url.pathname.endsWith('/exec'))throw Error('接続URLはApps Scriptの /exec URLを指定してください。');const data=await jsonp('catalog');if(data.status!=='ok'||data.apiVersion!==2)throw Error(data.message||'接続先のスクリプトが旧版です。Code.gsを更新して再デプロイしてください。');modules=data.modules;if(data.warnings?.length)notify('台帳の確認事項：'+data.warnings.join('／'));}catch(err){loadError=err.message;}finally{loading=false;render();flush();}
}
document.addEventListener('click',e=>{
  const el=e.target.closest('button');if(!el)return;
  if(el.dataset.page){page=el.dataset.page;selected=null;render();return;}
  if(el.dataset.module){selected=el.dataset.module;page='detail';render();window.scrollTo(0,0);return;}
  const a=el.dataset.action;if(!a)return;
  if(['home','catalog','guide','todo','history'].includes(a)){page=a;selected=null;render();}
  else if(a==='profile')profileForm();else if(a==='close')$('#modal').close();else if(a==='reload')load();
  else if(a==='logout'){cookie('',-1);user=null;progress={};selected=null;page='home';$('#identity').textContent='利用者を入力';$('#modal').close();render();profileForm();}
  else if(a==='watch'){const m=modules.find(x=>x.id===selected);if(!m||!C.video(m.video))return;record(m,'視聴');detail();notify('視聴を記録しました。');}
  else if(a==='consult')consult();else if(a==='sync')flush();
});
$('#identity').onclick=profileForm;$('#modal').addEventListener('cancel',e=>{if(!user)e.preventDefault();});
window.addEventListener('online',()=>flush());
const initial=savedProfile();if(initial?.id&&initial?.name&&initial?.group)applyUser(initial);
$('#brand-sub').textContent=hub+'・研修ハブ';document.title=hub+'・研修ハブ | '+(cfg.hospital||'浦安中央病院');
load();if(!user)profileForm();

</script>
</body></html>
